<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      src: local('JetBrains Mono'), local('Cascadia Code'), local('Consolas'), monospace;
    }
    .font-ascii {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .crt-box {
      background: radial-gradient(circle at center, #090e17 0%, #030407 100%);
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.95), 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .crt-box::before {
      content: " ";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 2.5px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.45;
    }
    .theme-diamond {
      color: #f8fafc;
      text-shadow: 0 0 2px rgba(255, 255, 255, 0.95), 0 0 8px rgba(186, 230, 253, 0.5);
    }
  </style>
</head>
<body class="bg-transparent text-slate-100 antialiased p-1 select-none flex justify-center">

  <div class="w-full max-w-lg bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 shadow-2xl flex flex-col gap-1.5">
    <!-- Header with Style Switcher & Formation Stage -->
    <div class="flex items-center justify-between text-xs pb-1.5 border-b border-slate-800">
      <div class="flex items-center gap-1.5 font-mono">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block shadow-sm shadow-amber-400/80 animate-pulse"></span>
        <span class="font-bold text-white tracking-tight text-[11px]">Real Ring Forge</span>
        <span id="stage-badge" class="px-1.5 py-0.5 rounded bg-amber-950/80 text-amber-300 border border-amber-800 text-[9px] font-semibold">
          1/5 Shank Forge
        </span>
      </div>

      <div class="flex items-center gap-1">
        <button id="btn-toggle-style" class="px-1.5 py-0.5 rounded bg-amber-600/80 hover:bg-amber-500 text-slate-950 font-bold text-[10px] transition" title="Toggle Real Ring / Viral Reel Style">
          💍 Real
        </button>
        <button id="btn-replay" class="px-1.5 py-0.5 rounded bg-indigo-900/50 hover:bg-indigo-800/80 text-cyan-300 text-[10px] font-mono border border-indigo-700/60 transition">
          🔄
        </button>
        <button id="btn-play" class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] font-medium border border-slate-700 transition">
          ⏸
        </button>
        <span id="widget-timer" class="font-mono text-cyan-400 font-bold text-[11px] tracking-wider ml-1">•f 00.00s</span>
      </div>
    </div>

    <!-- Terminal CRT Display -->
    <div class="crt-box rounded-xl p-1.5 flex flex-col items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing border border-slate-800/80" id="viewport">
      <pre id="ascii-screen" class="theme-diamond font-ascii text-[9.5px] leading-[10.5px] tracking-tight font-bold whitespace-pre drop-shadow select-none my-0.5"></pre>
    </div>

    <!-- HUD Footer -->
    <div class="flex items-center justify-between text-[10px] font-mono text-slate-400 px-1">
      <div class="flex items-center gap-2.5">
        <span>rot: <span id="w-rot" class="text-amber-400 font-bold">056.0°</span></span>
        <span>glints: <span id="w-glints" class="text-cyan-400 font-bold">272</span></span>
        <span>letters: <span id="w-letters" class="text-emerald-400 font-bold">1,366</span></span>
      </div>
      <div class="flex items-center gap-1 text-emerald-400 font-semibold text-[10px]">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block animate-ping"></span>
        30 fps
      </div>
    </div>
  </div>

  <script>
    const TAU = 2 * Math.PI;

    // Fast Real Ring mesh generator
    function buildRealRing() {
      const bandP = [], bandN = [], bandT = [];
      const nT = 160, nP = 28;
      for (let i = 0; i < nT; i++) {
        const t = (i / nT) * TAU, sx = Math.sin(t), sy = Math.cos(t);
        const ang = Math.abs(Math.PI - t);
        const topF = Math.max(0.0, (ang - 2.1) / (Math.PI - 2.1));
        const rBand = 1.05 + 0.07 * (topF * topF);
        const rX = 0.16 + 0.05 * topF, rZ = 0.19 + 0.05 * topF;
        for (let j = 0; j < nP; j++) {
          const p = (j / nP) * TAU, cp = Math.cos(p), sp = Math.sin(p);
          const radOff = (cp < 0 ? cp * 0.82 : cp * 1.18) * rX;
          bandP.push([(rBand + radOff) * sx, (rBand + radOff) * sy, sp * rZ]);
          bandN.push([cp * sx, cp * sy, sp]);
          bandT.push(ang);
        }
      }
      const galP = [], galN = [];
      for (let t = 0; t < TAU; t += TAU / 60) {
        const gx = 0.38 * Math.cos(t), gz = 0.38 * Math.sin(t);
        for (let p = 0; p < TAU; p += TAU / 8) {
          const cp = Math.cos(p), sp = Math.sin(p);
          galP.push([gx + 0.024 * cp * Math.cos(t), 1.25 + 0.024 * sp, gz + 0.024 * cp * Math.sin(t)]);
          galN.push([cp * Math.cos(t), sp, cp * Math.sin(t)]);
        }
      }
      const prongP = [], prongN = [], prongU = [];
      for (let i = 0; i < 4; i++) {
        const a = TAU * (i + 0.5) / 4, ca = Math.cos(a), sa = Math.sin(a);
        for (let u = 0; u <= 1.0; u += 0.035) {
          let r = (u < 0.65) ? (0.14 + (u/0.65) * (0.58 - 0.14)) : (0.58 - ((u-0.65)/0.35) * 0.10);
          let y = (u < 0.65) ? (1.05 + (u/0.65) * (1.36 - 1.05)) : (1.36 + ((u-0.65)/0.35) * 0.22);
          for (let phi = 0; phi < TAU; phi += TAU / 12) {
            const cp = Math.cos(phi), sp = Math.sin(phi), th = 0.026 * (1.0 - 0.25 * u);
            prongP.push([r * ca - sa * th * cp, y + th * sp, r * sa + ca * th * cp]);
            prongN.push([-sa * cp, sp, ca * cp]);
            prongU.push(u);
          }
        }
      }
      const gemP = [], gemN = [], gemF = [];
      for (let r = 0.02; r <= 0.35; r += 0.04) {
        for (let t = 0; t < TAU; t += TAU / 24) {
          gemP.push([r * Math.cos(t), 1.62, r * Math.sin(t)]);
          gemN.push([0, 1, 0]); gemF.push(0);
        }
      }
      for (let k = 0; k < 8; k++) {
        const a0 = TAU * k / 8, a1 = TAU * (k + 1) / 8, amid = 0.5 * (a0 + a1);
        const v0 = [0.35 * Math.cos(a0), 1.62, 0.35 * Math.sin(a0)];
        const v1 = [0.35 * Math.cos(a1), 1.62, 0.35 * Math.sin(a1)];
        const vs = [0.45 * Math.cos(amid), 1.50, 0.45 * Math.sin(amid)];
        for (let u = 0.15; u <= 0.85; u += 0.22) {
          for (let v = 0.15; v <= 0.85 - u; v += 0.22) {
            gemP.push([(1-u-v)*v0[0]+u*v1[0]+v*vs[0], (1-u-v)*v0[1]+u*v1[1]+v*vs[1], (1-u-v)*v0[2]+u*v1[2]+v*vs[2]]);
            gemN.push([0.88 * Math.cos(amid), 0.46, 0.88 * Math.sin(amid)]);
            gemF.push(k + 1);
          }
        }
      }
      const culet = [0, 1.08, 0];
      for (let k = 0; k < 8; k++) {
        const a0 = TAU * k / 8, a1 = TAU * (k + 1) / 8;
        const v0 = [0.56 * Math.cos(a0), 1.36, 0.56 * Math.sin(a0)];
        const v1 = [0.56 * Math.cos(a1), 1.36, 0.56 * Math.sin(a1)];
        for (let u = 0.1; u <= 0.9; u += 0.18) {
          for (let v = 0.1; v <= 0.9 - u; v += 0.18) {
            gemP.push([(1-u-v)*v0[0]+u*v1[0]+v*culet[0], (1-u-v)*v0[1]+u*v1[1]+v*culet[1], (1-u-v)*v0[2]+u*v1[2]+v*culet[2]]);
            gemN.push([0.72 * Math.cos(0.5*(a0+a1)), -0.69, 0.72 * Math.sin(0.5*(a0+a1))]);
            gemF.push(k + 9);
          }
        }
      }
      return { band: { P: bandP, N: bandN, T: bandT }, gal: { P: galP, N: galN }, prongs: { P: prongP, N: prongN, U: prongU }, gem: { P: gemP, N: gemN, F: gemF } };
    }

    const ringModel = buildRealRing();
    const RAMP = " .:-=+*#%@";
    const L = [0.577, 0.707, -0.408], H = [0.46, 0.56, -0.68];
    const WIDTH = 56, HEIGHT = 30;

    let rotDeg = 56.0, tiltDeg = 26.0, animT = 0.0, isPlaying = true, isRealStyle = true;

    const screen = document.getElementById("ascii-screen");
    const stageBadge = document.getElementById("stage-badge");
    const timerElem = document.getElementById("widget-timer");
    const wRot = document.getElementById("w-rot");
    const wLetters = document.getElementById("w-letters");
    const btnStyle = document.getElementById("btn-toggle-style");
    const btnPlay = document.getElementById("btn-play");
    const btnReplay = document.getElementById("btn-replay");

    btnStyle.addEventListener("click", () => {
      isRealStyle = !isRealStyle;
      btnStyle.textContent = isRealStyle ? "💍 Real" : "✨ Reel";
      tiltDeg = isRealStyle ? 26.0 : 12.0;
      animT = 0.0;
    });

    btnPlay.addEventListener("click", () => {
      isPlaying = !isPlaying;
      btnPlay.textContent = isPlaying ? "⏸" : "▶";
    });

    btnReplay.addEventListener("click", () => {
      animT = 0.0; rotDeg = 56.0;
    });

    function renderFrame(rot, t) {
      const ry = rot * Math.PI / 180, tx = tiltDeg * Math.PI / 180;
      const cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(tx), sx = Math.sin(tx);
      const zbuf = new Float32Array(WIDTH * HEIGHT).fill(-9999.0);
      const charbuf = new Array(WIDTH * HEIGHT).fill(" ");

      const normT = Math.min(1.0, t / 8.07);
      const band_p = Math.min(1.0, normT / 0.35);
      const basket_p = Math.min(1.0, Math.max(0.0, (normT - 0.30) / 0.25));
      const gem_p = Math.min(1.0, Math.max(0.0, (normT - 0.50) / 0.25));
      const crimp_p = Math.min(1.0, Math.max(0.0, (normT - 0.72) / 0.14));

      let stage = "1/5 Shank Forge";
      if (normT >= 0.85) stage = "5/5 Brilliance";
      else if (normT >= 0.72) stage = "4/5 Claw Setting";
      else if (normT >= 0.50) stage = "3/5 Stone Set";
      else if (normT >= 0.30) stage = "2/5 Basket Mount";
      stageBadge.textContent = stage;

      const dist = 3.65, Kx = 50.0, Ky = 25.0, midX = WIDTH/2, midY = HEIGHT/2 + 0.8;

      function proj(p, n) {
        const y1 = p[1]*cx - p[2]*sx, z1 = p[1]*sx + p[2]*cx;
        const x2 = p[0]*cy + z1*sy, z2 = -p[0]*sy + z1*cy;
        let rnx = 0, rny = 0, rnz = 0;
        if (n) {
          const ny1 = n[1]*cx - n[2]*sx, nz1 = n[1]*sx + n[2]*cx;
          rnx = n[0]*cy + nz1*sy; rny = ny1; rnz = -n[0]*sy + nz1*cy;
        }
        return [x2, y1, z2, rnx, rny, rnz];
      }

      // Band
      if (band_p > 0.0) {
        const cut = band_p * Math.PI;
        for (let i = 0; i < ringModel.band.P.length; i++) {
          if (ringModel.band.T[i] <= cut) {
            const [px, py, pz, nx, ny, nz] = proj(ringModel.band.P[i], ringModel.band.N[i]);
            const ooz = 1.0 / (pz + dist);
            const xp = Math.floor(midX + Kx * px * ooz), yp = Math.floor(midY - Ky * py * ooz);
            if (xp >= 0 && xp < WIDTH && yp >= 0 && yp < HEIGHT) {
              const idx = yp * WIDTH + xp;
              if (ooz > zbuf[idx]) {
                zbuf[idx] = ooz;
                const df = Math.max(0, nx*L[0] + ny*L[1] + nz*L[2]);
                const lum = 0.30 + 0.65 * df;
                charbuf[idx] = RAMP[Math.min(RAMP.length-1, Math.max(1, Math.floor(lum * (RAMP.length-1))))];
              }
            }
          }
        }
      }

      // Prongs
      if (basket_p > 0.0) {
        for (let i = 0; i < ringModel.prongs.P.length; i++) {
          if (ringModel.prongs.U[i] <= basket_p) {
            let p_copy = [ringModel.prongs.P[i][0], ringModel.prongs.P[i][1], ringModel.prongs.P[i][2]];
            if (crimp_p > 0.0 && p_copy[1] > 1.38) {
              p_copy[0] *= (1.0 - 0.08 * crimp_p);
              p_copy[2] *= (1.0 - 0.08 * crimp_p);
            }
            const [px, py, pz, nx, ny, nz] = proj(p_copy, ringModel.prongs.N[i]);
            const ooz = 1.0 / (pz + dist);
            const xp = Math.floor(midX + Kx * px * ooz), yp = Math.floor(midY - Ky * py * ooz);
            if (xp >= 0 && xp < WIDTH && yp >= 0 && yp < HEIGHT) {
              const idx = yp * WIDTH + xp;
              if (ooz > zbuf[idx]) {
                zbuf[idx] = ooz;
                charbuf[idx] = RAMP[Math.min(RAMP.length-1, Math.max(2, Math.floor((0.4+0.55*Math.max(0, nx*L[0]+ny*L[1]+nz*L[2]))*(RAMP.length-1))))];
              }
            }
          }
        }
      }

      // Diamond
      if (gem_p > 0.0) {
        const descent = (1.0 - gem_p) * 1.5;
        for (let i = 0; i < ringModel.gem.P.length; i++) {
          const pt = [ringModel.gem.P[i][0], ringModel.gem.P[i][1] + descent, ringModel.gem.P[i][2]];
          const [gx, gy, gz, nx, ny, nz] = proj(pt, ringModel.gem.N[i]);
          const ooz = 1.0 / (gz + dist);
          const xp = Math.floor(midX + Kx * gx * ooz), yp = Math.floor(midY - Ky * gy * ooz);
          if (xp >= 0 && xp < WIDTH && yp >= 0 && yp < HEIGHT) {
            const idx = yp * WIDTH + xp;
            if (ooz > zbuf[idx]) {
              zbuf[idx] = ooz;
              const sp = Math.max(0, nx*H[0] + ny*H[1] + nz*H[2]);
              const fSpark = Math.sin(ry * 4.0 + ringModel.gem.F[i] * 1.618);
              if (sp > 0.85 && fSpark > 0.5) charbuf[idx] = "@";
              else if (sp > 0.7 && fSpark > 0.1) charbuf[idx] = "%";
              else charbuf[idx] = RAMP[Math.min(RAMP.length-1, Math.max(2, Math.floor((0.35+0.65*Math.max(0, nx*L[0]+ny*L[1]+nz*L[2]))*(RAMP.length-1))))];
            }
          }
        }
      }

      let letters = 0;
      for (let i = 0; i < WIDTH * HEIGHT; i++) if (charbuf[i] !== " ") letters++;

      const lines = [];
      for (let y = 0; y < HEIGHT; y++) lines.push(charbuf.slice(y * WIDTH, (y + 1) * WIDTH).join(""));
      screen.textContent = lines.join("\n");

      timerElem.textContent = `•f ${t.toFixed(2).padStart(5, '0')}s`;
      wRot.textContent = `${(rot % 360).toFixed(1).padStart(5, '0')}°`;
      wLetters.textContent = letters.toLocaleString();
    }

    let lastClock = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      const dt = (now - lastClock) / 1000.0;
      lastClock = now;
      if (isPlaying) {
        animT += dt;
        rotDeg += 1.25;
      }
      renderFrame(rotDeg, animT);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
