<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    .studio-bg {
      background: radial-gradient(circle at 50% 35%, #182234 0%, #0a0e17 75%, #04060a 100%);
    }
  </style>
</head>
<body class="bg-transparent text-slate-100 antialiased p-1 select-none flex justify-center">

  <div class="w-full max-w-lg bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 shadow-2xl flex flex-col gap-1.5">
    <!-- Header with 90° Controls & Stage -->
    <div class="flex items-center justify-between text-xs pb-1.5 border-b border-slate-800">
      <div class="flex items-center gap-1.5 font-mono">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block shadow-sm shadow-amber-400/80 animate-pulse"></span>
        <span class="font-bold text-white tracking-tight text-[11px]">Real 3D Solitaire</span>
        <span id="stage-badge" class="px-1.5 py-0.5 rounded bg-amber-950/80 text-amber-300 border border-amber-800 text-[9px] font-semibold">
          Stage 5: Brilliance Locked
        </span>
      </div>

      <div class="flex items-center gap-1">
        <button id="btn-90-toggle" class="px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 font-bold text-[10px] transition" title="Toggle 90° Angle Presets">
          📐 90° Up
        </button>
        <button id="btn-replay" class="px-1.5 py-0.5 rounded bg-indigo-900/50 hover:bg-indigo-800/80 text-cyan-300 text-[10px] font-mono border border-indigo-700/60 transition" title="Replay">
          🔄
        </button>
        <button id="btn-play" class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] font-medium border border-slate-700 transition">
          ⏸
        </button>
      </div>
    </div>

    <!-- 3D Real Ring Canvas Viewport -->
    <div class="studio-bg rounded-xl overflow-hidden relative h-[280px] w-full flex items-center justify-center cursor-grab active:cursor-grabbing border border-slate-800/80" id="canvas-box">
      <div class="absolute top-2 left-3 z-20 text-[9px] font-mono text-slate-400 pointer-events-none bg-black/40 px-1.5 py-0.5 rounded border border-slate-800/60">
        [ Drag in 360° to Orbit · Solid 3D Ring ]
      </div>
      <canvas id="ring-canvas" class="w-full h-full block"></canvas>
    </div>

    <!-- HUD Footer -->
    <div class="flex items-center justify-between text-[10px] font-mono text-slate-400 px-1">
      <div class="flex items-center gap-2.5">
        <span>Metal: <strong class="text-amber-400">18K Gold</strong></span>
        <span>Stone: <strong class="text-cyan-300">Brilliant Diamond</strong></span>
      </div>
      <div class="flex items-center gap-1 text-emerald-400 font-semibold text-[10px]">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block animate-ping"></span>
        60 fps
      </div>
    </div>
  </div>

  <script>
    const TAU = 2 * Math.PI;
    const canvasBox = document.getElementById("canvas-box");
    const canvas = document.getElementById("ring-canvas");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, canvasBox.clientWidth / canvasBox.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 4.8);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(canvasBox.clientWidth, canvasBox.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const spot = new THREE.SpotLight(0xffffff, 2.8, 25, Math.PI / 4, 0.4);
    spot.position.set(4, 8, 6);
    scene.add(spot);
    const rim = new THREE.DirectionalLight(0x93c5fd, 1.6);
    rim.position.set(-6, 5, -5);
    scene.add(rim);

    // Materials
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd24d, metalness: 0.95, roughness: 0.14 });
    const gemMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.0,
      roughness: 0.0,
      transmission: 0.95,
      ior: 2.417,
      transparent: true,
      opacity: 0.95
    });

    const ringGroup = new THREE.Group();
    scene.add(ringGroup);

    // Band
    function makeBandGeo() {
      const geom = new THREE.BufferGeometry();
      const nT = 120, nP = 24;
      const pos = [], norm = [], idx = [];
      for (let i = 0; i <= nT; i++) {
        const t = (i / nT) * TAU, sx = Math.sin(t), sy = Math.cos(t);
        const topF = Math.max(0.0, (Math.abs(Math.PI - t) - 2.1) / (Math.PI - 2.1));
        const rBand = 1.05 + 0.07 * (topF * topF);
        const rX = 0.16 + 0.05 * topF, rZ = 0.19 + 0.05 * topF;
        for (let j = 0; j <= nP; j++) {
          const p = (j / nP) * TAU, cp = Math.cos(p), sp = Math.sin(p);
          const radOff = (cp < 0 ? cp * 0.82 : cp * 1.18) * rX;
          pos.push((rBand + radOff) * sx, (rBand + radOff) * sy, sp * rZ);
          norm.push(cp * sx, cp * sy, sp);
        }
      }
      for (let i = 0; i < nT; i++) {
        for (let j = 0; j < nP; j++) {
          const a = i * (nP + 1) + j, b = (i + 1) * (nP + 1) + j, c = (i + 1) * (nP + 1) + (j + 1), d = i * (nP + 1) + (j + 1);
          idx.push(a, b, d, b, c, d);
        }
      }
      geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
      geom.setIndex(idx);
      return geom;
    }

    const bandMesh = new THREE.Mesh(makeBandGeo(), goldMat);
    ringGroup.add(bandMesh);

    // Gallery wire
    const galMesh = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.026, 12, 48), goldMat);
    galMesh.rotation.x = Math.PI / 2;
    galMesh.position.y = 1.25;
    ringGroup.add(galMesh);

    // Prongs
    for (let i = 0; i < 4; i++) {
      const a = TAU * (i + 0.5) / 4, ca = Math.cos(a), sa = Math.sin(a);
      const pts = [];
      for (let u = 0; u <= 1.0; u += 0.1) {
        let r = (u < 0.65) ? (0.14 + (u/0.65)*(0.58-0.14)) : (0.58 - ((u-0.65)/0.35)*0.10);
        let y = (u < 0.65) ? (1.05 + (u/0.65)*(1.36-1.05)) : (1.36 + ((u-0.65)/0.35)*0.22);
        pts.push(new THREE.Vector3(r * ca, y, r * sa));
      }
      const prong = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 16, 0.028, 8, false), goldMat);
      ringGroup.add(prong);
    }

    // Diamond
    function makeDiamondGeo() {
      const geom = new THREE.BufferGeometry();
      const vertices = [], normals = [];
      const tablePts = [];
      for (let i = 0; i < 8; i++) {
        const ang = TAU * i / 8;
        tablePts.push(new THREE.Vector3(0.35 * Math.cos(ang), 1.62, 0.35 * Math.sin(ang)));
      }
      for (let i = 1; i < 7; i++) {
        vertices.push(tablePts[0].x, tablePts[0].y, tablePts[0].z, tablePts[i].x, tablePts[i].y, tablePts[i].z, tablePts[i+1].x, tablePts[i+1].y, tablePts[i+1].z);
        normals.push(0, 1, 0, 0, 1, 0, 0, 1, 0);
      }
      const culetPt = new THREE.Vector3(0, 1.08, 0);
      for (let i = 0; i < 8; i++) {
        const a0 = TAU * i / 8, a1 = TAU * (i + 1) / 8, amid = TAU * (i + 0.5) / 8;
        const p0 = new THREE.Vector3(0.56 * Math.cos(a0), 1.36, 0.56 * Math.sin(a0));
        const p1 = new THREE.Vector3(0.56 * Math.cos(a1), 1.36, 0.56 * Math.sin(a1));
        const sp = new THREE.Vector3(0.45 * Math.cos(amid), 1.50, 0.45 * Math.sin(amid));
        const v0 = tablePts[i], v1 = tablePts[(i+1)%8];

        vertices.push(v0.x, v0.y, v0.z, v1.x, v1.y, v1.z, sp.x, sp.y, sp.z);
        for (let k = 0; k < 3; k++) normals.push(0.88 * Math.cos(amid), 0.46, 0.88 * Math.sin(amid));

        vertices.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z, culetPt.x, culetPt.y, culetPt.z);
        for (let k = 0; k < 3; k++) normals.push(0.72 * Math.cos(amid), -0.69, 0.72 * Math.sin(amid));
      }
      geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      return geom;
    }
    const diamondMesh = new THREE.Mesh(makeDiamondGeo(), gemMat);
    ringGroup.add(diamondMesh);

    // Drag Orbit
    let isDragging = false, lx = 0, ly = 0;
    canvasBox.addEventListener("mousedown", (e) => { isDragging = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener("mouseup", () => isDragging = false);
    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      ringGroup.rotation.y += (e.clientX - lx) * 0.012;
      ringGroup.rotation.x += (e.clientY - ly) * 0.012;
      lx = e.clientX; ly = e.clientY;
    });

    // 90 Degree Angle Presets
    const btn90 = document.getElementById("btn-90-toggle");
    let angleIdx = 0;
    const angles = [
      { label: "📐 90° Up", rx: 0, ry: 0 },
      { label: "📐 90° Side", rx: 0, ry: Math.PI / 2 },
      { label: "📐 90° Top", rx: Math.PI / 2, ry: 0 },
      { label: "🔄 90° Flat", rx: -Math.PI / 2, ry: 0 },
      { label: "💍 26° View", rx: 0.45, ry: 0.6 }
    ];
    btn90.addEventListener("click", () => {
      angleIdx = (angleIdx + 1) % angles.length;
      btn90.textContent = angles[angleIdx].label;
      ringGroup.rotation.x = angles[angleIdx].rx;
      ringGroup.rotation.y = angles[angleIdx].ry;
    });

    let isPlaying = true;
    document.getElementById("btn-play").addEventListener("click", () => isPlaying = !isPlaying);
    document.getElementById("btn-replay").addEventListener("click", () => { ringGroup.rotation.set(0, 0, 0); });

    function tick() {
      requestAnimationFrame(tick);
      if (isPlaying) ringGroup.rotation.y += 0.018;
      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
